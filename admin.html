<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন — আবেদন ফরম ব্যবস্থাপনা</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
  :root{--bg:#F0F2F5;--card:#FFF;--accent:#1B5E20;--accent-dark:#0D3B0F;--text:#222;--text-light:#666;--border:#DDD;--radius:8px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  .top-bar{background:var(--accent-dark);padding:12px 24px;color:#fff;}
  .top-bar h1{font-size:1.1rem;font-weight:700;}
  .container{max-width:1200px;margin:0 auto;padding:20px 16px;}
  .config-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .config-card label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px;}
  .config-row{display:flex;gap:10px;}
  .config-row input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.9rem;font-family:inherit;}
  .btn{padding:10px 24px;border:none;border-radius:var(--radius);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;}
  .btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent-dark);}
  .btn-sm{padding:6px 14px;font-size:.8rem;}
  .btn-outline{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}.btn-outline:hover{background:var(--accent);color:#fff;}
  .data-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .data-card h2{font-size:1rem;font-weight:700;margin-bottom:12px;color:var(--accent-dark);}
  .stats{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .stat-box{background:#F5F5F5;border-radius:var(--radius);padding:10px 18px;font-size:.85rem;}
  .stat-box strong{color:var(--accent);font-size:1.1rem;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{background:#F5F5F5;padding:8px 10px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:8px 10px;border-bottom:1px solid #EEE;vertical-align:middle;}
  tr:hover td{background:#FAFAFA;}
  .photo-thumb{width:35px;height:42px;object-fit:cover;border-radius:3px;border:1px solid var(--border);}
  .status-msg{padding:12px;border-radius:var(--radius);margin-top:12px;font-size:.85rem;display:none;}
  .status-msg.error{display:block;background:#FFEBEE;color:#B71C1C;}
  .status-msg.info{display:block;background:#E3F2FD;color:#0D47A1;}
  .status-msg.success{display:block;background:#E8F5E9;color:#1B5E20;}
  .empty-state{text-align:center;padding:40px;color:var(--text-light);}
  @media(max-width:768px){.config-row{flex-direction:column;}}
</style>
</head>
<body>
<div class="top-bar"><h1>🔒 অ্যাডমিন প্যানেল — আবেদন ফরম ব্যবস্থাপনা</h1></div>
<div class="container">
  <div class="config-card">
    <label>Google Apps Script URL:</label>
    <div class="config-row">
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/AKfycbx.../exec">
      <button class="btn btn-primary" onclick="loadData()">📥 ডাটা লোড করুন</button>
    </div>
    <div class="status-msg" id="loadStatus"></div>
  </div>
  <div class="data-card">
    <h2>আবেদনসমূহ</h2>
    <div class="stats" id="statsArea" style="display:none">
      <div class="stat-box">মোট আবেদন: <strong id="totalCount">0</strong></div>
      <div class="stat-box">সাধারণ: <strong id="generalCount">0</strong></div>
      <div class="stat-box">আজীবন: <strong id="lifeCount">0</strong></div>
    </div>
    <div id="tableArea"><div class="empty-state">উপরে Apps Script URL দিয়ে "ডাটা লোড করুন" ক্লিক করুন।</div></div>
  </div>
</div>
<script>
let allData=[];
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}
async function loadData(){
  const url=document.getElementById('scriptUrl').value.trim(),st=document.getElementById('loadStatus');
  if(!url){st.className='status-msg error';st.textContent='URL দিন।';return;}
  st.className='status-msg info';st.textContent='লোড হচ্ছে...';
  try{const r=await fetch(url);allData=await r.json();st.className='status-msg success';st.textContent='✅ '+allData.length+' টি আবেদন।';renderTable();}
  catch(e){st.className='status-msg error';st.textContent='❌ '+e.message;}
}
function renderTable(){
  const a=document.getElementById('tableArea'),s=document.getElementById('statsArea');
  if(!allData.length){a.innerHTML='<div class="empty-state">কোনো আবেদন নেই।</div>';s.style.display='none';return;}
  s.style.display='flex';
  document.getElementById('totalCount').textContent=allData.length;
  document.getElementById('generalCount').textContent=allData.filter(d=>d.membershipType==='সাধারণ').length;
  document.getElementById('lifeCount').textContent=allData.filter(d=>d.membershipType==='আজীবন').length;
  let h='<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>ছবি</th><th>নাম</th><th>ইংরেজী</th><th>সদস্যপদ</th><th>মোবাইল</th><th>পদবী</th><th>TrxID</th><th></th></tr></thead><tbody>';
  allData.forEach((d,i)=>{const dt=d.submitTimestamp?new Date(d.submitTimestamp).toLocaleDateString('bn-BD'):'';const ph=d.photo?'<img class="photo-thumb" src="'+d.photo+'">':'—';
    h+='<tr><td>'+(i+1)+'</td><td>'+ph+'</td><td>'+esc(d.nameBn)+'</td><td>'+esc(d.nameEn)+'</td><td>'+esc(d.membershipType)+'</td><td>'+esc(d.mobile)+'</td><td>'+esc(d.retiredPost)+'</td><td>'+esc(d.trxId)+'</td><td><button class="btn btn-sm btn-outline" onclick="downloadDocx('+i+')">📄 DOCX</button></td></tr>';});
  h+='</tbody></table></div>';a.innerHTML=h;
}

// ═══ DOCX ═══
function b64(s){const r=s.split(',')[1]||s,b=atob(r),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function fdt(ds){if(!ds)return'';const d=new Date(ds);if(isNaN(d))return String(ds);const bn=n=>String(n).replace(/[0-9]/g,c=>'০১২৩৪৫৬৭৮৯'[c]);const m=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];return bn(d.getDate())+' '+m[d.getMonth()]+' '+bn(d.getFullYear());}
function S(v){return v===null||v===undefined?'':String(v);}

async function downloadDocx(idx){
  const D=allData[idx];if(!D)return alert('ডাটা নেই');
  const{Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,ImageRun,
    AlignmentType,BorderStyle,WidthType,VerticalMergeType,VerticalAlign,UnderlineType}=docx;

  const FN='NikoshLightBAN',FE='Times New Roman';
  const SZ=24,SE=22,ST=28,SS=22,SF=24;
  const PW=9746; // 11906-720-1440

  const nB={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const nBs={top:nB,bottom:nB,left:nB,right:nB};
  const CM={top:20,bottom:20,left:40,right:40};
  const LS={line:360};

  const br=(t,bold)=>new TextRun({text:S(t),font:FN,size:SZ,bold:!!bold,boldCs:!!bold});
  const er=(t,sz)=>new TextRun({text:S(t),font:FE,size:sz||SE});

  const lc=(t,w)=>new TableCell({width:{size:w,type:WidthType.DXA},borders:nBs,margins:CM,verticalAlign:VerticalAlign.CENTER,
    children:[new Paragraph({spacing:LS,children:[br(t,true)]})]});
  const vc=(t,w,en)=>new TableCell({width:{size:w,type:WidthType.DXA},borders:nBs,margins:CM,verticalAlign:VerticalAlign.CENTER,
    children:[new Paragraph({spacing:LS,children:[en?er(S(t)):br(S(t))]})]});
  const blank=(w)=>new TableCell({width:{size:w,type:WidthType.DXA},borders:nBs,margins:CM,children:[new Paragraph({spacing:LS,children:[]})]});

  const hp=D.photo&&String(D.photo).length>100,hs=D.signature&&String(D.signature).length>100;
  const pb=hp?b64(D.photo):null,sb=hs?b64(D.signature):null;

  const PH_W=1805;
  const ps=new TableCell({verticalMerge:VerticalMergeType.RESTART,width:{size:PH_W,type:WidthType.DXA},borders:nBs,margins:{top:40,bottom:40,left:40,right:0},verticalAlign:VerticalAlign.CENTER,
    children:[new Paragraph({alignment:AlignmentType.CENTER,spacing:LS,
      children:hp?[new ImageRun({data:pb,transformation:{width:86,height:106},type:'jpg',altText:{title:'Photo',description:'Photo',name:'photo'}})]:[br('ছবি')]})]});
  const pc=()=>new TableCell({verticalMerge:VerticalMergeType.CONTINUE,width:{size:PH_W,type:WidthType.DXA},borders:nBs,margins:CM,children:[new Paragraph({spacing:LS,children:[]})]});

  const LW=2068,VW=PW-LW-PH_W;

  // 6-col triple rows
  const W6=[2068,1530,1171,1352,1618,2007];
  // 7-col child+edu
  const W7=[2068,630,530,630,530,1900,3458];
  // 4-col dual
  const W4=[2068,2805,1868,3005];
  // 2-col for field 15 — wider label to fit in 1 row
  const W15=[4200,5546];
  // 2-col address
  const WB=[2068,7678];

  // Signature: narrower right side
  const SIG_L=5746,SIG_R=4000;

  const doc=new Document({
    styles:{default:{document:{run:{font:FN,size:SZ}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:288,right:720,bottom:720,left:1440}}},
    children:[
      // ── Header ──
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:20},children:[new TextRun({text:'অবসরপ্রাপ্ত প্রাণিসম্পদ কর্মকর্তা কল্যাণ সমিতি',font:FN,size:ST,bold:true,boldCs:true})]}),
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:20},children:[new TextRun({text:"(Retired Livestock Officer's Welfare Association)",font:FE,size:SS,bold:true,boldCs:true})]}),
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:10},children:[new TextRun({text:'অস্থায়ী কার্যালয়: প্রাণিসম্পদ অধিদপ্তর, প্রাণিসম্পদ ভবন,',font:FN,size:SS})]}),
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:10},children:[new TextRun({text:'কৃষি খামার সড়ক, ফার্মগেট, ঢাকা -১২১৫।',font:FN,size:SS})]}),
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:80},border:{bottom:{style:BorderStyle.SINGLE,size:4,color:'1B5E20',space:0}},
        children:[new TextRun({text:S(D.membershipType)+' সদস্যপদের আবেদন ফরম',font:FN,size:SF,bold:true,boldCs:true})]}),

      // ── Personal + Photo (3 cols) ──
      new Table({width:{size:PW,type:WidthType.DXA},columnWidths:[LW,VW,PH_W],rows:[
        new TableRow({children:[lc('১। নাম (বাংলা):',LW),vc(D.nameBn,VW),ps]}),
        new TableRow({children:[lc('   (ইংরেজী বড় অক্ষর):',LW),vc(D.nameEn,VW,true),pc()]}),
        new TableRow({children:[lc('২। পিতার নাম:',LW),vc(D.fatherName,VW),pc()]}),
        new TableRow({children:[lc('৩। মাতার নাম:',LW),vc(D.motherName,VW),pc()]}),
        new TableRow({children:[lc('৪। স্বামী/স্ত্রীর নাম:',LW),vc(D.spouseName,VW),pc()]}),
      ]}),

      // ── Triple rows (6 cols) ──
      new Table({width:{size:PW,type:WidthType.DXA},columnWidths:W6,rows:[
        new TableRow({children:[lc('৫। জন্ম তারিখ:',W6[0]),vc(fdt(D.dob),W6[1]),lc('৬। রক্তের গ্রুপ:',W6[2]),vc(D.bloodGroup,W6[3]),lc('৭। জাতীয়তা:',W6[4]),vc(D.nationality,W6[5])]}),
        new TableRow({children:[lc('৮। জা: প: পত্র নং:',W6[0]),vc(S(D.nid),W6[1]),lc('৯। ধর্ম:',W6[2]),vc(D.religion,W6[3]),lc('১০। বৈবাহিক:',W6[4]),vc(D.maritalStatus,W6[5])]}),
      ]}),

      // ── সন্তান + শিক্ষা (7 cols) ──
      new Table({width:{size:PW,type:WidthType.DXA},columnWidths:W7,rows:[
        new TableRow({children:[lc('১১। সন্তান সংখ্যা:',W7[0]),lc('পুত্র',W7[1]),vc(S(D.sons),W7[2]),lc('কন্যা',W7[3]),vc(S(D.daughters),W7[4]),lc('১২। শিক্ষাগত যোগ্যতা:',W7[5]),vc(D.education,W7[6])]}),
      ]}),

      // ── পদবী+মোবাইল, ফোন+ইমেইল (4 cols) ──
      new Table({width:{size:PW,type:WidthType.DXA},columnWidths:W4,rows:[
        new TableRow({children:[lc('১৩। অবসরকালীন পদবী:',W4[0]),vc(D.retiredPost,W4[1]),lc('১৪। মোবাইল নং:',W4[2]),vc(S(D.mobile),W4[3])]}),
        new TableRow({children:[lc('     ফোন নং:',W4[0]),vc(S(D.phone),W4[1]),lc('ই-মেইল:',W4[2]),vc(D.email,W4[3],true)]}),
      ]}),

      // ── ১৫ অবসরত্তোর পেশা (wider label) ──
      new Table({width:{size:PW,type:WidthType.DXA},columnWidths:W15,rows:[
        new TableRow({children:[lc('১৫। অবসরত্তোর পেশা (যদি থাকে) পদবী/কর্মস্থল:',W15[0]),vc(D.currentOccupation,W15[1])]}),
      ]}),

      // ── ঠিকানা (no border on empty rows) ──
      new Table({width:{size:PW,type:WidthType.DXA},columnWidths:WB,rows:[
        new TableRow({children:[lc('১৬। বর্তমান ঠিকানা:',WB[0]),vc(D.presentAddress,WB[1])]}),
        new TableRow({children:[blank(WB[0]),blank(WB[1])]}),
        new TableRow({children:[lc('১৭। স্থায়ী ঠিকানা:',WB[0]),vc(D.permanentAddress,WB[1])]}),
        new TableRow({children:[blank(WB[0]),blank(WB[1])]}),
      ]}),

      // ── Signature (narrower right) ──
      ...(hs?[new Paragraph({alignment:AlignmentType.RIGHT,spacing:{before:100,after:0},children:[new ImageRun({data:sb,transformation:{width:118,height:32},type:'jpg',altText:{title:'Sig',description:'Sig',name:'sig'}})]})]:[new Paragraph({spacing:{before:100},children:[]})]),

      new Table({width:{size:PW,type:WidthType.DXA},columnWidths:[SIG_L,SIG_R],rows:[
        new TableRow({children:[
          new TableCell({width:{size:SIG_L,type:WidthType.DXA},borders:nBs,margins:CM,children:[new Paragraph({spacing:{before:40},children:[br('তারিখ: '+fdt(D.submitTimestamp))]})]}),
          new TableCell({width:{size:SIG_R,type:WidthType.DXA},borders:nBs,margins:CM,children:[
            new Paragraph({alignment:AlignmentType.CENTER,border:{bottom:{style:BorderStyle.SINGLE,size:1,color:'333333'}},children:[new TextRun({text:'                                ',font:FN,size:SZ})]}),
            new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:20},children:[br('স্বাক্ষর',true)]}),
            new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:20},children:[br('নাম: '+S(D.nameBn))]}),
            new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:20},children:[br('পদবী: '+S(D.retiredPost))]}),
          ]}),
        ]}),
      ]}),

      // ── Office Use ──
      new Paragraph({spacing:{before:120},border:{top:{style:BorderStyle.SINGLE,size:4,color:'333333'}},children:[]}),
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:60,after:40},
        children:[new TextRun({text:'অফিসে ব্যবহারের জন্য',font:FN,size:SZ,bold:true,boldCs:true,underline:{type:UnderlineType.SINGLE}})]}),

      // সদস্য নং (left) ও তারিখ (right) — no borders
      new Paragraph({spacing:{before:40,after:40},
        children:[
          br('সদস্য নং ____________'),
          new TextRun({text:'\t',font:FN,size:SZ}),
        ],
        tabStops:[{type:docx.TabStopType.RIGHT,position:docx.TabStopPosition.MAX}],
      }),
      new Paragraph({spacing:{before:0,after:40},
        tabStops:[{type:docx.TabStopType.RIGHT,position:docx.TabStopPosition.MAX}],
        children:[
          new TextRun({text:'\tতারিখ: ____________',font:FN,size:SZ}),
        ],
      }),

      new Paragraph({spacing:{before:60,after:40,line:360},alignment:AlignmentType.BOTH,children:[
        br('আবেদনের প্রেক্ষিতে এবং সদস্যপদ পাত্রের শর্তাবলী প্রতিপালিত হওয়ায় জনাব '),
        br(S(D.nameBn),true),
        br(' পদবী '),
        br(S(D.retiredPost),true),
        br(' -কে______________তারিখ হতে গঠনতন্ত্রের ৮নং অনুচ্ছেদ মোতাবেক অবসরপ্রাপ্ত প্রাণিসম্পদ কর্মকর্তা কল্যাণ সমিতির সাধারন/আজীবন সদস্যপদ প্রদান করা হল।'),
      ]}),
      new Paragraph({spacing:{before:40,after:40,line:360},alignment:AlignmentType.BOTH,children:[br('তার সদস্য নং ___________________।')]}),
      new Paragraph({spacing:{before:160},children:[]}),
      new Paragraph({alignment:AlignmentType.CENTER,indent:{left:5760},children:[br('সাধারণ সম্পাদক',true)]}),
      new Paragraph({alignment:AlignmentType.CENTER,indent:{left:5760},children:[br('অবসরপ্রাপ্ত প্রাণিসম্পদ কর্মকর্তা কল্যাণ সমিতি।')]}),
    ]}]
  });
  const bl=await Packer.toBlob(doc);saveAs(bl,'আবেদন_'+S(D.nameBn).replace(/\s+/g,'_')+'.docx');
}
</script>
</body>
</html>
