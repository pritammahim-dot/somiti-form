<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন — আবেদন ফরম ব্যবস্থাপনা</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
  :root{--bg:#F0F2F5;--card:#FFF;--accent:#1B5E20;--accent-dark:#0D3B0F;--text:#222;--text-light:#666;--border:#DDD;--radius:8px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  .top-bar{background:var(--accent-dark);padding:12px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;}
  .top-bar h1{font-size:1.1rem;font-weight:700;}
  .container{max-width:1200px;margin:0 auto;padding:20px 16px;}
  .config-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .config-card label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px;}
  .config-row{display:flex;gap:10px;}
  .config-row input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.9rem;font-family:inherit;}
  .config-row input:focus{outline:none;border-color:var(--accent);}
  .btn{padding:10px 24px;border:none;border-radius:var(--radius);font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-sm{padding:6px 14px;font-size:.8rem;}
  .btn-outline{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
  .btn-outline:hover{background:var(--accent);color:#fff;}

  .data-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .data-card h2{font-size:1rem;font-weight:700;margin-bottom:12px;color:var(--accent-dark);}
  .stats{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .stat-box{background:#F5F5F5;border-radius:var(--radius);padding:10px 18px;font-size:.85rem;}
  .stat-box strong{color:var(--accent);font-size:1.1rem;}

  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{background:#F5F5F5;padding:8px 10px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:8px 10px;border-bottom:1px solid #EEE;vertical-align:middle;}
  tr:hover td{background:#FAFAFA;}
  .photo-thumb{width:35px;height:42px;object-fit:cover;border-radius:3px;border:1px solid var(--border);}

  .status-msg{padding:12px;border-radius:var(--radius);margin-top:12px;font-size:.85rem;display:none;}
  .status-msg.error{display:block;background:#FFEBEE;color:#B71C1C;}
  .status-msg.info{display:block;background:#E3F2FD;color:#0D47A1;}
  .status-msg.success{display:block;background:#E8F5E9;color:#1B5E20;}

  .empty-state{text-align:center;padding:40px;color:var(--text-light);}
  @media(max-width:768px){.config-row{flex-direction:column;}.stats{flex-direction:column;}}
</style>
</head>
<body>

<div class="top-bar">
  <h1>🔒 অ্যাডমিন প্যানেল — আবেদন ফরম ব্যবস্থাপনা</h1>
</div>

<div class="container">
  <div class="config-card">
    <label>Google Apps Script URL:</label>
    <div class="config-row">
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/AKfycbx.../exec">
      <button class="btn btn-primary" onclick="loadData()">📥 ডাটা লোড করুন</button>
    </div>
    <div class="status-msg" id="loadStatus"></div>
  </div>

  <div class="data-card">
    <h2>আবেদনসমূহ</h2>
    <div class="stats" id="statsArea" style="display:none">
      <div class="stat-box">মোট আবেদন: <strong id="totalCount">0</strong></div>
      <div class="stat-box">সাধারণ: <strong id="generalCount">0</strong></div>
      <div class="stat-box">আজীবন: <strong id="lifeCount">0</strong></div>
    </div>
    <div id="tableArea">
      <div class="empty-state">উপরে Apps Script URL দিয়ে "ডাটা লোড করুন" ক্লিক করুন।</div>
    </div>
  </div>
</div>

<script>
let allData = [];

async function loadData(){
  const url = document.getElementById('scriptUrl').value.trim();
  const statusEl = document.getElementById('loadStatus');
  if(!url){statusEl.className='status-msg error';statusEl.textContent='অনুগ্রহ করে URL দিন।';return;}

  statusEl.className='status-msg info';statusEl.textContent='ডাটা লোড হচ্ছে...';

  try{
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    allData = await resp.json();
    statusEl.className='status-msg success';statusEl.textContent='✅ '+allData.length+' টি আবেদন লোড হয়েছে।';
    renderTable();
  }catch(err){
    statusEl.className='status-msg error';
    statusEl.textContent='❌ ডাটা লোড করতে সমস্যা: '+err.message+' — URL সঠিক কি না যাচাই করুন।';
  }
}

function renderTable(){
  const area=document.getElementById('tableArea');
  const stats=document.getElementById('statsArea');
  if(!allData.length){area.innerHTML='<div class="empty-state">কোনো আবেদন পাওয়া যায়নি।</div>';stats.style.display='none';return;}

  stats.style.display='flex';
  document.getElementById('totalCount').textContent=allData.length;
  document.getElementById('generalCount').textContent=allData.filter(d=>d.membershipType==='সাধারণ').length;
  document.getElementById('lifeCount').textContent=allData.filter(d=>d.membershipType==='আজীবন').length;

  let html='<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>ছবি</th><th>নাম (বাংলা)</th><th>নাম (ইংরেজী)</th><th>সদস্যপদ</th><th>মোবাইল</th><th>অবসরকালীন পদবী</th><th>তারিখ</th><th>কার্যক্রম</th></tr></thead><tbody>';

  allData.forEach((d,i)=>{
    const date=d.submitTimestamp?new Date(d.submitTimestamp).toLocaleDateString('bn-BD'):'';
    const photoThumb=d.photo?'<img class="photo-thumb" src="'+d.photo+'">':'—';
    html+='<tr><td>'+(i+1)+'</td><td>'+photoThumb+'</td><td>'+esc(d.nameBn)+'</td><td>'+esc(d.nameEn)+'</td><td>'+esc(d.membershipType)+'</td><td>'+esc(d.mobile)+'</td><td>'+esc(d.retiredPost)+'</td><td>'+date+'</td><td><button class="btn btn-sm btn-outline" onclick="downloadDocx('+i+')">📄 DOCX</button></td></tr>';
  });
  html+='</tbody></table></div>';
  area.innerHTML=html;
}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}

// ═══════════════════════════════════
//  DOCX GENERATION — Compact 1-Page
// ═══════════════════════════════════
function base64ToUint8(b64){
  const raw=b64.split(',')[1]||b64;
  const bin=atob(raw);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr;
}

function formatDateBn(ds){
  if(!ds)return'';
  const d=new Date(ds);
  if(isNaN(d))return ds;
  const bn=n=>String(n).replace(/[0-9]/g,c=>'০১২৩৪৫৬৭৮৯'[c]);
  const m=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  return bn(d.getDate())+' '+m[d.getMonth()]+' '+bn(d.getFullYear());
}

async function downloadDocx(idx){
  const data=allData[idx];
  if(!data){alert('ডাটা পাওয়া যায়নি।');return;}

  const{Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,ImageRun,
    AlignmentType,BorderStyle,WidthType,VerticalMergeType,VerticalAlign}=docx;

  const SZ=18; // 9pt
  const SZS=16; // 8pt
  const FONT='Noto Sans Bengali';
  const nB={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const nBs={top:nB,bottom:nB,left:nB,right:nB};
  const uB={...nBs,bottom:{style:BorderStyle.DOTTED,size:1,color:'555555'}};
  const CM={top:20,bottom:20,left:40,right:40};

  // Helper: label cell
  const lc=(txt,w)=>new TableCell({width:{size:w,type:WidthType.DXA},borders:nBs,margins:CM,
    children:[new Paragraph({spacing:{before:0,after:0},children:[new TextRun({text:txt,font:FONT,size:SZ,bold:true})]})]});

  // Helper: value cell with underline
  const vc=(txt,w)=>new TableCell({width:{size:w,type:WidthType.DXA},borders:uB,margins:CM,
    children:[new Paragraph({spacing:{before:0,after:0},children:[new TextRun({text:txt||'',font:FONT,size:SZ})]})]});

  // Photo bytes
  const hasPhoto=data.photo&&data.photo.length>100;
  const photoBytes=hasPhoto?base64ToUint8(data.photo):null;
  const hasSig=data.signature&&data.signature.length>100;
  const sigBytes=hasSig?base64ToUint8(data.signature):null;

  // Photo cell (merged vertically over 5 rows)
  const photoCellStart=new TableCell({
    verticalMerge:VerticalMergeType.RESTART,
    width:{size:1700,type:WidthType.DXA},
    borders:{top:nB,bottom:nB,left:nB,right:nB},
    margins:{top:40,bottom:40,left:40,right:0},
    verticalAlign:VerticalAlign.CENTER,
    children:[new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:0,after:0},
      children:hasPhoto?[new ImageRun({data:photoBytes,transformation:{width:75,height:92},type:'jpg',
        altText:{title:'Photo',description:'Applicant photo',name:'photo'}})]
        :[new TextRun({text:'ছবি',font:FONT,size:SZS,color:'999999'})]})]
  });
  const photoCellCont=()=>new TableCell({
    verticalMerge:VerticalMergeType.CONTINUE,
    width:{size:1700,type:WidthType.DXA},
    borders:nBs,margins:CM,
    children:[new Paragraph({spacing:{before:0,after:0},children:[]})]
  });

  // Page content width: A4 = 11906, margins 720 each side = 10466
  const PW=10466;
  const LW=1800; // label width for 3-col section
  const VW=PW-LW-1700; // value width (with photo)

  // ── Table A: Personal info + photo (3 cols: label, value, photo) ──
  const tableA=new Table({
    width:{size:PW,type:WidthType.DXA},
    columnWidths:[LW,PW-LW-1700,1700],
    rows:[
      new TableRow({children:[lc('১। নাম বাংলা:',LW),vc(data.nameBn,VW),photoCellStart]}),
      new TableRow({children:[lc('ইংরেজী বড় অক্ষর:',LW),vc(data.nameEn,VW),photoCellCont()]}),
      new TableRow({children:[lc('২। পিতার নাম:',LW),vc(data.fatherName,VW),photoCellCont()]}),
      new TableRow({children:[lc('৩। মাতার নাম:',LW),vc(data.motherName,VW),photoCellCont()]}),
      new TableRow({children:[lc('৪। স্বামী/স্ত্রীর নাম:',LW),vc(data.spouseName,VW),photoCellCont()]}),
    ]
  });

  // ── Table B: 6-column rows ──
  // Row widths: 3 pairs of label+value
  const L6=1400,V6=(PW-L6*3)/3; // ~1400 label, ~2088 value each
  const tableB=new Table({
    width:{size:PW,type:WidthType.DXA},
    columnWidths:[L6,V6,L6,V6,L6,V6],
    rows:[
      new TableRow({children:[lc('৫। জন্ম তারিখ:',L6),vc(formatDateBn(data.dob),V6),lc('৬। রক্তের গ্রুপ:',L6),vc(data.bloodGroup,V6),lc('৭। জাতীয়তা:',L6),vc(data.nationality,V6)]}),
      new TableRow({children:[lc('৮। NID নং:',L6),vc(data.nid,V6),lc('৯। ধর্ম:',L6),vc(data.religion,V6),lc('১০। বৈবাহিক:',L6),vc(data.maritalStatus,V6)]}),
    ]
  });

  // ── Table C: Mixed rows ──
  // Row: সন্তান পুত্র __ কন্যা __ | শিক্ষাগত যোগ্যতা __
  const L4a=1200,V4a=900,L4b=900,V4b=1200;
  const L4c=1800,V4c=PW-L4a-V4a-L4b-V4b-L4c;
  const tableC=new Table({
    width:{size:PW,type:WidthType.DXA},
    columnWidths:[L4a,V4a,L4b,V4b,L4c,V4c],
    rows:[
      new TableRow({children:[
        lc('১১। সন্তান: পুত্র',L4a),vc(data.sons,V4a),lc('কন্যা',L4b),vc(data.daughters,V4b),
        lc('১২। শিক্ষাগত যোগ্যতা:',L4c),vc(data.education,V4c)
      ]}),
    ]
  });

  // ── Table D: 4-column rows ──
  const LD=1800,VD=(PW-LD*2)/2;
  const tableD=new Table({
    width:{size:PW,type:WidthType.DXA},
    columnWidths:[LD,VD,LD,VD],
    rows:[
      new TableRow({children:[lc('১৩। অবসরকালীন পদবী:',LD),vc(data.retiredPost,VD),lc('১৪। মোবাইল নং:',LD),vc(data.mobile,VD)]}),
      new TableRow({children:[lc('ফোন নং:',LD),vc(data.phone,VD),lc('ই-মেইল:',LD),vc(data.email,VD)]}),
    ]
  });

  // ── Table E: Full-width rows ──
  const LE=2800,VE=PW-LE;
  const tableE=new Table({
    width:{size:PW,type:WidthType.DXA},
    columnWidths:[LE,VE],
    rows:[
      new TableRow({children:[lc('১৫। অবসরত্তোর পেশা/পদবী/কর্মস্থল:',LE),vc(data.currentOccupation,VE)]}),
      new TableRow({children:[lc('১৬। বর্তমান ঠিকানা:',LE),vc('',VE)]}),
      new TableRow({children:[
        new TableCell({width:{size:LE,type:WidthType.DXA},borders:nBs,margins:CM,children:[new Paragraph({spacing:{before:0,after:0},children:[]})]}),
        vc(data.presentAddress,VE)
      ]}),
      new TableRow({children:[lc('১৭। স্থায়ী ঠিকানা:',LE),vc('',VE)]}),
      new TableRow({children:[
        new TableCell({width:{size:LE,type:WidthType.DXA},borders:nBs,margins:CM,children:[new Paragraph({spacing:{before:0,after:0},children:[]})]}),
        vc(data.permanentAddress,VE)
      ]}),
    ]
  });

  // ── Signature Area ──
  const sigChildren=[];
  if(hasSig){
    sigChildren.push(new Paragraph({alignment:AlignmentType.RIGHT,spacing:{before:120,after:0},
      children:[new ImageRun({data:sigBytes,transformation:{width:100,height:40},type:'jpg',
        altText:{title:'Signature',description:'Applicant signature',name:'sig'}})]}));
  }
  sigChildren.push(
    new Paragraph({alignment:AlignmentType.RIGHT,spacing:{before:hasSig?0:200,after:0},
      border:{bottom:{style:BorderStyle.SINGLE,size:1,color:'333333'}},
      children:[new TextRun({text:'                                                          ',font:FONT,size:SZ})]}),
    new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:40,after:0},
      children:[new TextRun({text:'                                                                                                     স্বাক্ষর',font:FONT,size:SZ,bold:true})]}),
  );

  // Date and Name/Post table
  const sigTable=new Table({
    width:{size:PW,type:WidthType.DXA},
    columnWidths:[PW/2,PW/2],
    rows:[new TableRow({children:[
      new TableCell({width:{size:PW/2,type:WidthType.DXA},borders:nBs,margins:CM,
        children:[new Paragraph({spacing:{before:40,after:0},children:[
          new TextRun({text:'তারিখ: '+formatDateBn(data.submitTimestamp),font:FONT,size:SZ})]})]}),
      new TableCell({width:{size:PW/2,type:WidthType.DXA},borders:nBs,margins:CM,
        children:[
          new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:40,after:0},children:[new TextRun({text:'নাম: '+data.nameBn,font:FONT,size:SZ})]}),
          new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:20,after:0},children:[new TextRun({text:'পদবী: '+data.retiredPost,font:FONT,size:SZ})]}),
        ]}),
    ]})]
  });

  // ── Office Use Section ──
  const officeSection=[
    new Paragraph({spacing:{before:160,after:0},border:{top:{style:BorderStyle.SINGLE,size:4,color:'333333'}},children:[]}),
    new Paragraph({alignment:AlignmentType.CENTER,spacing:{before:80,after:60},
      children:[new TextRun({text:'অফিসে ব্যবহারের জন্য',font:FONT,size:20,bold:true})]}),
    new Paragraph({spacing:{after:40},children:[
      new TextRun({text:'সদস্য নং ____________                                                                        তারিখ: ____________',font:FONT,size:SZ})]}),
    new Paragraph({spacing:{before:60,after:40},children:[new TextRun({
      text:'আবেদনের প্রেক্ষিতে এবং সদস্যপদ পাত্রের শর্তাবলী প্রতিপালিত হওয়ায় জনাব ________________________ পদবী __________________-কে',
      font:FONT,size:SZS})]}),
    new Paragraph({spacing:{after:40},children:[new TextRun({
      text:'______________তারিখ হতে গঠনতন্ত্রের ৮নং অনুচ্ছেদ মোতাবেক অক্ষমতাপ্রাপ্ত প্রাণিসম্পদ কর্মকর্তা কল্যাণ সমিতির '+data.membershipType+' সদস্যপদ প্রদান করা হল। তার সদস্য নং ____________।',
      font:FONT,size:SZS})]}),
    new Paragraph({spacing:{before:160},children:[]}),
    new Paragraph({alignment:AlignmentType.RIGHT,spacing:{after:0},children:[new TextRun({text:'সাধারণ সম্পাদক',font:FONT,size:SZ,bold:true})]}),
    new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:'অবসরপ্রাপ্ত প্রাণিসম্পদ কর্মকর্তা কল্যাণ সমিতি।',font:FONT,size:SZS})]}),
  ];

  // ── Build Document ──
  const doc=new Document({
    styles:{default:{document:{run:{font:FONT,size:SZ}}}},
    sections:[{
      properties:{
        page:{
          size:{width:11906,height:16838},
          margin:{top:720,right:720,bottom:720,left:720}
        }
      },
      children:[
        // Header
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:20},
          children:[new TextRun({text:'অবসরপ্রাপ্ত প্রাণিসম্পদ কর্মকর্তা কল্যাণ সমিতি',font:FONT,size:24,bold:true})]}),
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:20},
          children:[new TextRun({text:"(Retired Livestock Officer's Welfare Association)",font:'Arial',size:16,italics:true})]}),
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:10},
          children:[new TextRun({text:'অস্থায়ী কার্যালয়: প্রাণিসম্পদ অধিদপ্তর, প্রাণিসম্পদ ভবন, কৃষি খামার সড়ক, ফার্মগেট, ঢাকা -১২১৫।',font:FONT,size:15})]}),
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:80},
          border:{bottom:{style:BorderStyle.SINGLE,size:4,color:'1B5E20'}},
          children:[new TextRun({text:data.membershipType+' সদস্যপদের আবেদন ফরম',font:FONT,size:20,bold:true})]}),

        // Data tables
        tableA,
        tableB,
        tableC,
        tableD,
        tableE,

        // Signature
        ...sigChildren,
        sigTable,

        // Office Use
        ...officeSection,
      ]
    }]
  });

  const blob=await Packer.toBlob(doc);
  saveAs(blob,'আবেদন_'+data.nameBn.replace(/\s+/g,'_')+'.docx');
}
</script>
</body>
</html>
